<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyFood · 食物记录</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
<link rel="apple-touch-icon" href="favicon.svg?v=3" />
<meta name="theme-color" content="#66508f" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css?v=95" />
</head>
<body>
  <main class="app-shell">
    <form id="foodForm" class="card">
      <section class="meal-entry">
        <label class="image-picker">
          <input id="imageInput" type="file" accept="image/*" />
          <img id="imagePreview" class="image-preview" alt="图片预览" hidden />
          <strong class="upload-icon" aria-label="上传图片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" /></svg></strong>
        </label>
        <div class="meal-details">
          <label class="field">
            <span>菜名 <em>可选</em></span>
            <input id="dishName" type="text" placeholder="" autocomplete="off" />
          </label>
          <label class="field">
            <span>品牌名 <em>可选</em></span>
            <input id="brandName" type="text" placeholder="" autocomplete="off" />
          </label>
        </div>
      </section>

      <section class="field"><span>味道 <em>可多选</em></span><div class="choice-grid" id="flavors"><button class="choice" type="button" data-value="酸">酸</button><button class="choice" type="button" data-value="甜">甜</button><button class="choice" type="button" data-value="苦">苦</button><button class="choice" type="button" data-value="辣">辣</button><button class="choice" type="button" data-value="咸">咸</button></div></section>

      <section class="field">
        <span>偏好</span>
        <div class="segmented" id="preference">
          <button type="button" data-value="偏好吃">偏好吃</button>
          <button type="button" data-value="偏难吃">偏难吃</button>
        </div>
        <label class="field dislike-reason" id="dislikeReasonField" hidden>
          <span>难吃理由 <b class="required-mark">*</b></span>
          <input id="dislikeReason" type="text" autocomplete="off" />
        </label>
      </section>

      <section class="field">
        <span>食材 <b class="required-mark">*</b></span>
        <div class="add-row">
          <input id="ingredientInput" type="text" placeholder="" autocomplete="off" />
          <button class="small-button" id="addIngredient" type="button">添加</button>
        </div>
        <div class="chips" id="ingredientChips" aria-live="polite"></div>
        <p class="form-error" id="formError" role="alert"></p>
      </section>

    </form>

    <section class="recent-section">
      <div class="section-heading"><h2>最近记录</h2></div>
       <div class="record-tools"><input id="recordSearch" type="text" placeholder="" /><button id="clearSearch" type="button" aria-label="清除搜索">×</button></div>
      <div id="records" class="records"></div>
      <p id="emptyState" class="empty-state">还没有记录。吃完就记一下，之后更容易想起。</p>
    </section>
  </main>
  <button class="save-fixed" type="submit" form="foodForm">保存记录</button>
    <script src="app.js?v=85"></script>
</body>
</html>
