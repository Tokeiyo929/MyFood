<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>MyFood · 食物记录</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />
<meta name="theme-color" content="#66508f" />
<link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section id="recordsView" class="app-view active-view">
    <form id="foodForm" class="card">
      
      <section class="meal-entry">
        <label class="image-picker">
          <input id="imageInput" type="file" accept="image/*" />
          <strong class="upload-icon" aria-label="上传图片"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="m6.5 16 3.5-3.5 2.5 2.5 2-2 3 3"/><circle cx="8.5" cy="9" r="1.2"/></svg></strong>
          <img id="imagePreview" class="image-preview" alt="图片预览" hidden />
        </label>
        <div class="meal-details">
          <label class="field">
            <span>产品名称 <em>可选</em></span>
            <input id="dishName" type="text" placeholder="" autocomplete="off" />
          </label>
          <label class="field">
            <span>生产者 <em>可选</em></span>
            <input id="brandName" type="text" placeholder="" autocomplete="off" />
          </label>
        </div>
      </section>

      <section class="field"><span>产品类别</span><input id="tagInput" type="search" placeholder="搜索产品类别" autocomplete="off" /><div class="chips" id="tagChips" aria-live="polite"></div><div class="tag-suggestions" id="tagSuggestions"></div></section>

      <section class="flavor-preference-section">
        <div class="flavor-preference-layout">
          <div id="flavors" class="flavor-wheel"></div>
          <div class="preference-panel">
            <div class="segmented" id="preference"></div>
          </div>
        </div>
        <label class="field dislike-reason" id="dislikeReasonField" hidden>
          <span>难吃理由 <b class="required-mark">*</b></span>
          <input id="dislikeReason" type="text" autocomplete="off" />
        </label>
        <label class="field dislike-reason" id="goodReasonField" hidden>
          <span>好吃理由 <b class="required-mark">*</b></span>
          <input id="goodReason" type="text" autocomplete="off" />
        </label>
      </section>

      <section class="field">
        <span>原料 <b class="required-mark">*</b></span>
        <input id="ingredientInput" type="search" placeholder="搜索原料" autocomplete="off" />
        <div class="chips" id="ingredientChips" aria-live="polite"></div>
        <div class="tag-suggestions" id="ingredientSuggestions"></div>
        <p class="form-error" id="formError" role="alert"></p>
      </section>

      <div class="form-footer"><button class="save-fixed" type="submit">保存记录</button></div>
    </form>

    <section class="recent-section">
      <div class="section-heading"><h2>历史记录</h2></div>
       <div class="record-tools"><input id="recordSearch" type="text" placeholder="" /><button id="clearSearch" type="button" aria-label="清除搜索">×</button></div>
      <div id="records" class="records"></div>
      <p id="emptyState" class="empty-state">还没有记录。吃完就记一下，之后更容易想起。</p>
    </section>
    </section>

    <section id="tagsView" class="app-view catalog-view" hidden>
      <h1>全部产品类别</h1>
      <div id="allTags" class="catalog-list"></div>
    </section>

    <section id="ingredientsView" class="app-view catalog-view" hidden>
      <h1>全部原料</h1>
      <div class="catalog-add-row"><input id="catalogIngredientInput" type="text" placeholder="添加原料" autocomplete="off" /><button id="addCatalogIngredient" type="button">添加</button></div>
      <div id="allIngredients" class="catalog-list"></div>
    </section>
  </main>
  <nav class="tabs-bar" aria-label="主导航">
    <button type="button" data-view="tagsView">产品类别</button>
    <button type="button" class="active" data-view="recordsView">记录</button>
    <button type="button" data-view="ingredientsView">原料</button>
  </nav>
    <script src="app.js"></script>
</body>
</html>
